name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Smoke checks — no pytest suite / [dev] extra in this repo yet.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in sync with requires-python in pyproject.toml (>=3.10).
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import smoke test
        run: |
          python -c "from reflex_qicheng_docedit import doc_edit, DocEdit; print(DocEdit.__name__)"

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel includes editor.jsx and panels
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel built"
          names = zipfile.ZipFile(wheels[0]).namelist()
          assert "reflex_qicheng_docedit/editor.jsx" in names, names
          assert "reflex_qicheng_docedit/__init__.py" in names, names
          assert "reflex_qicheng_docedit/panels/insertMenu.jsx" in names, names
          print("OK:", wheels[0])
          print("\n".join(n for n in names if n.startswith("reflex_qicheng_docedit/")))
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
